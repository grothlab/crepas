description: "Suggested text and references to use when describing pipeline usage within the methods section of a publication."
section_name: "grothlab/crepas Methods Description"
section_href: "https://github.com/grothlab/crepas"
plot_type: "html"
data: |
  <h4>Methods</h4>
  <p>
  Data was processed using crepas (grothlab/crepas, v${workflow.manifest.version}) ${doi_text}, a reproducible analysis pipeline for nascent chromatin sequencing data implemented in Nextflow (<a href="https://doi.org/10.1038/nbt.3820">Di Tommaso et al., 2017</a>). The pipeline builds upon components and best practices developed by the nf-core initiative (<a href="https://doi.org/10.1038/s41587-020-0439-x">Ewels et al., 2020</a>) and uses reproducible software environments provided through Bioconda (<a href="https://doi.org/10.1038/s41592-018-0046-7">Grüning et al., 2018</a>) and BioContainers (<a href="https://doi.org/10.1093/bioinformatics/btx192">da Veiga Leprevost et al., 2017</a>).
  </p>

  <p>The pipeline was executed with Nextflow v${workflow.nextflow.version} using the following command:</p>
  <pre><code>${workflow.commandLine}</code></pre>

  <p>${tool_citations}</p>

  <h4>References</h4>
  <ul>
    <li>Ruiz-Pérez, S., Du, Q., Biran, A., Groth, A., &amp; Alcaraz, N. (2026). CREPAS: a reproducible nascent chromatin sequencing analysis pipeline for epigenome replication studies. doi: <a href="https://doi.org/10.5281/zenodo.20788108">10.5281/zenodo.20788108</a></li>

    <li>Ewels, P. A., Peltzer, A., Fillinger, S., Patel, H., Alneberg, J., Wilm, A., Garcia, M. U., Di Tommaso, P., &amp; Nahnsen, S. (2020). The nf-core framework for community-curated bioinformatics pipelines. Nature Biotechnology, 38(3), 276-278. doi: <a href="https://doi.org/10.1038/s41587-020-0439-x">10.1038/s41587-020-0439-x</a></li>

    <li>Di Tommaso, P., Chatzou, M., Floden, E. W., Barja, P. P., Palumbo, E., &amp; Notredame, C. (2017). Nextflow enables reproducible computational workflows. Nature Biotechnology, 35(4), 316-319. doi: <a href="https://doi.org/10.1038/nbt.3820">10.1038/nbt.3820</a></li>

    <li>Grüning, B., Dale, R., Sjödin, A., Chapman, B. A., Rowe, J., Tomkins-Tinch, C. H., Valieris, R., Köster, J., &amp; Bioconda Team. (2018). Bioconda: sustainable and comprehensive software distribution for the life sciences. Nature Methods, 15(7), 475–476. doi: https://doi.org/10.1038/s41592-018-0046-7">10.1038/s41592-018-0046-7</a></li>

    <li>da Veiga Leprevost, F., Grüning, B. A., Alves Aflitos, S., Röst, H. L., Uszkoreit, J., Barsnes, H., Vaudel, M., Moreno, P., Gatto, L., Weber, J., Bai, M., Jimenez, R. C., Sachsenberg, T., Pfeuffer, J., Vera Alvarez, R., Griss, J., Nesvizhskii, A. I., &amp; Perez-Riverol, Y. (2017). BioContainers: an open-source and community-driven framework for software standardization. Bioinformatics, 33(16), 2580–2582. doi: 10.1093/bioinformatics/btx192">10.1093/bioinformatics/btx192</a></li>

    ${tool_bibliography}
  </ul>
