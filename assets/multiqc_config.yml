  deseq2_pca_3:
    order: -1800
  deseq2_pca_4:
    order: -1900
  deseq2_pca_5:
    order: -2000
  deseq2_pca_6:
    order: -2100
  deseq2_pca_7:
    order: -2200
  deseq2_pca_8:
    order: -2300
  deseq2_pca_9:
    order: -2400
  deseq2_pca_10:
    order: -2500
  deseq2_clustering_1:
    order: -2600
  deseq2_clustering_2:
    order: -2700
  deseq2_clustering_3:
    order: -2800
  deseq2_clustering_4:
    order: -2900
  deseq2_clustering_5:
