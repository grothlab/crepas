export_plots: true
#exclude_modules:
#  - "general_stats"

disable_version_detection: true

# Order of modules
module_order:
  - fastqc:
      anchor: "fastqc_raw"
      name: "LIB: FastQC (raw)"
      info: "This section of the report shows FastQC results for individual libraries before trimming."
      path_filters:
        - "./fastqc/*.zip"
  - cutadapt:
      anchor: "cutadapt"
      name: "LIB: TrimGalore!/Cutadapt (trimmed)"
      info: "This section of the report shows the length of trimmed reads by Cutadapt (within TrimGalore) for individual libraries."
  - fastqc:
      anchor: "fastqc_trimmed"
      name: "LIB: FastQC (trimmed)"
      info: "This section of the report shows FastQC results for individual libraries after trimming."
      path_filters:
        - "./trimgalore/fastqc/*.zip"
  - samtools:
      anchor: "samtools_alignment"
      name: "LIB: SAMTools stats (aligned)"
      info: "This section of the report shows SAMTools stats for individual libraries."
      # path_filters:
        # - "./alignment/library/*"
  - samtools:
      anchor: "samtools_unfiltered"
      name: "MERGED LIB: SAMTools stats (unfiltered)"
      info: "This section of the report shows SAMTools stats after merging libraries (technical replicates) and before filtering."
      # path_filters:
        # - "./alignment/mergedLibrary/*"
  # - picard:
  #     name: "MERGED LIB: Picard (unfiltered)"
  #     info: "This section of the report shows picard results after merging libraries and before filtering."
  #     path_filters:
  #       - "./alignment/mergedLibrary/unfiltered/picard_metrics/*"
  # - preseq:
  #     name: "MERGED LIB: Preseq (unfiltered)"
  #     info: "This section of the report shows Preseq results after merging libraries and before filtering."
  #     path_filters:
  #       - "./alignment/mergedLibrary/preseq/*"
  # - umitools/dedup:
  #     name: "MERGED LIB: UMI-tools dedup"
  #     info: "This section of the report shows UMI-tools dedup results after merging libraries."
  #     path_filters:
  #       - "./alignment/mergedLibrary/umi_dedup/*"
  - samtools:
      anchor: "samtools_umi_dedup"
      name: "MERGED LIB: SAMTools stats (UMI-dedup)"
      info: "This section of the report shows SAMTools stats after merging libraries and UMI-based deduplication."
      # path_filters:
      #   - "./alignment/mergedLibrary/umi_dedup/*"
  - picard:
      name: "MERGED LIB: Picard MarkDuplicates (unfiltered)"
      info: "This section of the report shows Picard MarkDuplicates metrics after merging libraries and before filtering."
      # path_filters:
      #   - "./alignment/mergedLibrary/picard_markduplicates/*"  
  - samtools:
      anchor: "samtools_markduplicates"
      name: "MERGED LIB: SAMTools stats (marked duplicates)"
      info: "This section of the report shows SAMTools stats after merging libraries and after marking duplicates with Picard."
      # path_filters:
      #   - "./alignment/mergedLibrary/picard_markduplicates/*"
  - samtools:
      anchor: "samtools_flT1"
      name: "MERGED LIB: SAMTools stats (flT1)"
      info: "This section of the report shows SAMTools stats after merging libraries and filtering out duplicates and improper-pairs."
      # path_filters:
      #   - "./alignment/mergedLibrary/umi_dedup/*"
  - samtools:
      name: "MERGED LIB: SAMTools stats (after flT2)"
      info: "This section of the report shows SAMTools results after splitting by spike-in and filtering out improper pairs."
      path_filters:
        - "./alignment/mergedLibrary/spikein_split/*"
  - samtools:
      name: "MERGED LIB: SAMTools stats (allocated multimappers)"
      info: "This section of the report shows SAMTools results after merging libraries, filtering with SAMBAMBA, splitting by spike-in, and allocating multimappers."
      path_filters:
        - "./alignment/mergedLibrary/multimap/*"
  - picard:
      name: "MERGED LIB: Picard (filtered)"
      info: "This section of the report shows picard results after merging libraries and after filtering."
      path_filters:
        - "./alignment/mergedLibrary/filtered/picard_metrics/*"
  - deeptools:
      name: "MERGED LIB: deepTools"
      anchor: "deeptools"
      info: "This section of the report shows QC plots generated by deepTools."
  - featureCounts:
      name: "MERGED LIB: featureCounts (consensus peaks)"
      anchor: "consensus_featurecounts"
      info: "This section of the report shows featureCounts results for the number of reads assigned to merged library consensus peaks."
      path_filters:
        - "./macs3/featurecounts/*.summary"

custom_plot_config:
  picard_insert_size:
    cpswitch_c_active: False
    smooth_points: 1000
  featurecounts:
    cpswitch_c_active: False

extra_fn_clean_exts:
  - "fastq.gz"
  - "_trimmed"
  - "_val"
  - "sorted.bam"
  - ".Lb"
  - "mkD"
  - "clN"
  - "mLb"
  - "_peaks"
  - ".FRiP"
  - ".peak"
  - "_spp"
  - ".spp"
  - "lc_extrap"


# Customise the module search patterns to speed up execution time
#  - Skip module sub-tools that we are not interested in
#  - Replace file-content searching with filename pattern searching
#  - Don't add anything that is the same as the MultiQC default
# See https://multiqc.info/docs/#optimise-file-search-patterns for details
sp:
  cutadapt:
    fn: "*trimming_report.txt"

  hisat2:
    fn: "*.hisat2.summary.log"

  preseq:
    fn: "*.lc_extrap.txt"

  samtools/stats:
    fn: "*.stats"
  samtools/flagstat:
    fn: "*.flagstat"
  samtools/idxstats:
    fn: "*.idxstats*"

  deeptools/plotFingerprintOutRawCounts:
    fn: "*plotFingerprint*"
  deeptools/plotProfile:
    fn: "*plotProfile*"
  phantompeakqualtools/out:
    fn: "*.spp.out"

  picard/markdups:
    fn: "*.MarkDuplicates.metrics.txt"
  picard/alignment_metrics:
    skip: true
  picard/basedistributionbycycle:
    skip: true
  picard/gcbias:
    skip: true
  picard/hsmetrics:
    skip: true
  picard/insertsize:
    skip: true
  picard/oxogmetrics:
    skip: true
  picard/pcr_metrics:
    skip: true
  picard/quality_by_cycle:
    skip: true
  picard/quality_score_distribution:
    skip: true
  picard/quality_yield_metrics:
    skip: true
  picard/rnaseqmetrics:
    skip: true
  picard/rrbs_metrics:
    skip: true
  picard/sam_file_validation:
    skip: true
  picard/variant_calling_metrics:
    skip: true
  picard/wgs_metrics:
    skip: true