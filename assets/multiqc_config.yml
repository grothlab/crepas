  cutadapt:
    order: 6003
  fastqc_trimmed:
    order: 6002
  # Alignment

  # Post-alignment QC
  strand_shift_correlation:
    order: 4004
  nsc_coefficient:
    order: 4003
  rsc_coefficient:
    order: 4002
    
  # Peak calling
  peak_count:
    order: 2005
  frip_score:
    order: 2006
  peak_annotation:
