# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: fastq_align_bwamem2
description: Align reads to a reference genome using bwa-mem2 then sort with samtools
keywords:
  - align
  - fasta
  - genome
  - reference
  - bwamem2
components:
  - bwamem2/mem
  - samtools/sort
  - samtools/index
  - samtools/stats
  - samtools/idxstats
  - samtools/flagstat
  - bam_sort_stats_samtools
input:
  - ch_reads:
      description: |
        List of input FastQ files of size 1 and 2 for single-end and paired-end data,
        respectively.
        Structure: [ val(meta), [ path(reads) ] ]
  - ch_index:
      description: |
        BWA-MEM2 genome index files
        Structure: [ val(meta2), path(index) ]
  - val_sort_bam:
      type: boolean
      description: If true, bwa-mem2 sorts the resulting BAM file
      pattern: "true|false"
  - ch_fasta_fai:
      type: file
      description: |
        Reference fasta file and its index
        Structure: [ val(meta3), path(fasta), path(fai) ]
output:
  - bam_orig:
      description: |
        BAM file produced by bwa-mem2
        Structure: [ val(meta), path(bam) ]
  - bam:
      description: |
        BAM file ordered by samtools
        Structure: [ val(meta), path(bam) ]
  - index:
      description: |
        Index of the ordered BAM file
        Structure: [ val(meta), path(index) ]
  - stats:
      description: |
        File containing samtools stats output
        Structure: [ val(meta), path(stats) ]
  - flagstat:
      description: |
        File containing samtools flagstat output
        Structure: [ val(meta), path(flagstat) ]
  - idxstats:
      description: |
        File containing samtools idxstats output
        Structure: [ val(meta), path(idxstats) ]
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
