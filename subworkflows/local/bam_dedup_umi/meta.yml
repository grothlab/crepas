# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bam_dedup_umi"
description: |
  UMI-based deduplication of both a genome and a transcriptome BAM (choosing UMICollapse or
  UMI-tools as the dedup tool), then coordinate-sort/dedup/name-sort the transcriptome BAM and
  fix up paired-end reads with UMI-tools prepare-for-RSEM
keywords:
  - deduplication
  - umi
  - bam
  - genome
  - transcriptome
  - umicollapse
  - umitools
components:
  - bam_dedup_stats_samtools_umicollapse
  - bam_dedup_stats_samtools_umitools
  - bam_sort_stats_samtools
  - samtools/sort
  - umitools/prepareforrsem
input:
  - ch_genome_bam:
      description: |
        Genome-aligned BAM file and its index
        Structure: [ val(meta), path(bam), path(index) ]
  - ch_chrom_sizes:
      type: file
      description: |
        Chromosome sizes file (first two columns: chrom, size; e.g. a .fai file), used when
        skip_split_by_chrom is false
        Structure: [ val(meta), path(chrom_sizes) ]
  - ch_fasta_fai:
      type: file
      description: |
        Reference fasta file and its index, used to name-sort the deduplicated transcriptome BAM
        Structure: [ val(meta), path(fasta), path(fai) ]
  - umi_dedup_tool:
      type: string
      description: UMI deduplication tool to use, either 'umicollapse' or 'umitools'
  - umitools_dedup_stats:
      type: boolean
      description: |
        Whether to generate UMI-tools deduplication stats. Only used when umi_dedup_tool is
        'umitools'.
      pattern: "true|false"
  - ch_transcriptome_bam:
      description: |
        Transcriptome-aligned BAM file
        Structure: [ val(meta), path(bam) ]
  - ch_transcript_fasta_fai:
      type: file
      description: |
        Transcript fasta file and its index
        Structure: [ val(meta), path(fasta), path(fai) ]
  - skip_split_by_chrom:
      type: boolean
      description: |
        If false, split each BAM by chromosome before deduplication and merge the deduplicated
        BAMs back together afterwards. If true, deduplicate each whole BAM in a single task.
      pattern: "true|false"
output:
  - bam:
      description: |
        Deduplicated genome BAM file
        Structure: [ val(meta), path(bam) ]
  - index:
      description: |
        Index of the deduplicated genome BAM file
        Structure: [ val(meta), path(index) ]
  - genomic_dedup_log:
      description: |
        Genome BAM deduplication log/stats (from UMICollapse or UMI-tools, depending on
        umi_dedup_tool)
        Structure: [ val(meta), path(log) ]
  - transcriptomic_dedup_log:
      description: |
        Transcriptome BAM deduplication log/stats (from UMICollapse or UMI-tools, depending on
        umi_dedup_tool)
        Structure: [ val(meta), path(log) ]
  - prepare_for_rsem_log:
      description: |
        UMI-tools prepare-for-RSEM log, for paired-end samples
        Structure: [ val(meta), path(log) ]
  - stats:
      description: |
        File containing samtools stats output, for both the genome and transcriptome BAMs
        Structure: [ val(meta), path(stats) ]
  - flagstat:
      description: |
        File containing samtools flagstat output, for both the genome and transcriptome BAMs
        Structure: [ val(meta), path(flagstat) ]
  - idxstats:
      description: |
        File containing samtools idxstats output, for both the genome and transcriptome BAMs
        Structure: [ val(meta), path(idxstats) ]
  - tsv_edit_distance:
      description: |
        UMI-tools edit distance TSV, when umi_dedup_tool is 'umitools' and umitools_dedup_stats
        is true
        Structure: [ val(meta), path(tsv) ]
  - tsv_per_umi:
      description: |
        UMI-tools per-UMI TSV, when umi_dedup_tool is 'umitools' and umitools_dedup_stats is true
        Structure: [ val(meta), path(tsv) ]
  - tsv_umi_per_position:
      description: |
        UMI-tools UMI-per-position TSV, when umi_dedup_tool is 'umitools' and
        umitools_dedup_stats is true
        Structure: [ val(meta), path(tsv) ]
  - multiqc_files:
      description: |
        Genome BAM dedup log, stats, flagstat and idxstats files, collected for MultiQC
        Structure: [ path(file) ]
  - transcriptome_bam:
      description: |
        Final transcriptome BAM: deduplicated, name-sorted and, for paired-end samples, fixed up
        with UMI-tools prepare-for-RSEM
        Structure: [ val(meta), path(bam) ]
  - transcriptome_dedup_bam:
      description: |
        Transcriptome BAM immediately after deduplication, before name-sorting
        Structure: [ val(meta), path(bam) ]
  - transcriptome_sorted_bam:
      description: |
        Deduplicated transcriptome BAM, restored to name-sorted order
        Structure: [ val(meta), path(bam) ]
  - transcriptome_sorted_bam_index:
      description: |
        Index of the coordinate-sorted, deduplicated transcriptome BAM (before name-sorting)
        Structure: [ val(meta), path(index) ]
  - transcriptome_filtered_bam:
      description: |
        UMI-tools prepare-for-RSEM output, for paired-end samples only
        Structure: [ val(meta), path(bam) ]
authors:
  - "@pinin4fjords"
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
