# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bam_dedup_stats_samtools_umitools"
description: |
  UMI-tools dedup (optionally splitting the BAM by chromosome first and merging back
  afterwards), index the deduplicated BAM file and run samtools stats, flagstat and idxstats
keywords:
  - umi
  - dedup
  - index
  - bam
  - sam
  - cram
components:
  - bam_split_by_chromosome
  - umitools/dedup
  - samtools/merge
  - samtools/index
  - samtools/stats
  - samtools/idxstats
  - samtools/flagstat
  - bam_stats_samtools
input:
  - ch_bam_index:
      description: |
        Input BAM file and its index
        Structure: [ val(meta), path(bam), path(index/csi) ]
  - ch_chrom_sizes:
      type: file
      description: |
        Chromosome sizes file (first two columns: chrom, size; e.g. a .fai file), required when
        skip_split_by_chrom is false
        Structure: [ val(meta), path(chrom_sizes) ]
  - val_get_dedup_stats:
      type: boolean
      description: |
        Generate output stats when running "umi_tools dedup"
      pattern: "true|false"
  - skip_split_by_chrom:
      type: boolean
      description: |
        If false, split the BAM by chromosome before deduplication (one UMI-tools dedup task per
        chromosome) and merge the deduplicated BAMs back together afterwards. If true,
        deduplicate the whole BAM in a single task.
      pattern: "true|false"
output:
  - bam:
      description: |
        UMI deduplicated BAM file (merged back together, when skip_split_by_chrom is false)
        Structure: [ val(meta), path(bam) ]
  - index:
      description: |
        Index of the deduplicated BAM file
        Structure: [ val(meta), path(index) ]
  - deduplog:
      description: |
        UMI-tools deduplication log
        Structure: [ val(meta), path(log) ]
  - tsv_edit_distance:
      description: |
        UMI-tools edit distance TSV, when val_get_dedup_stats is true
        Structure: [ val(meta), path(tsv) ]
  - tsv_per_umi:
      description: |
        UMI-tools per-UMI TSV, when val_get_dedup_stats is true
        Structure: [ val(meta), path(tsv) ]
  - tsv_umi_per_position:
      description: |
        UMI-tools UMI-per-position TSV, when val_get_dedup_stats is true
        Structure: [ val(meta), path(tsv) ]
  - stats:
      description: |
        File containing samtools stats output
        Structure: [ val(meta), path(stats) ]
  - flagstat:
      description: |
        File containing samtools flagstat output
        Structure: [ val(meta), path(flagstat) ]
  - idxstats:
      description: |
        File containing samtools idxstats output
        Structure: [ val(meta), path(idxstats) ]
authors:
  - "@drpatelh"
  - "@KamilMaliszArdigen"
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
