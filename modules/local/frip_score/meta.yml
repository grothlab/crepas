# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "frip_score"
description: Calculate the Fraction of Reads in Peaks (FRiP) score for a BAM file against a peak/BED file
keywords:
  - bedtools
  - samtools
  - frip
  - peaks
  - qc
tools:
  - bedtools:
      description: |
        A set of tools for genomic analysis tasks, specifically enabling genome arithmetic
        (merge, count, complement, intersect) on various file types. Used here (`intersectBed`)
        to count, per read, how many peaks it overlaps.
      homepage: https://bedtools.readthedocs.io/
      documentation: https://bedtools.readthedocs.io/en/latest/content/tools/intersect.html
      tool_dev_url: https://github.com/arq5x/bedtools2
      doi: "10.1093/bioinformatics/btq033"
      licence: ["MIT"]
      identifier: "biotools:bedtools"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: Sorted BAM file
        pattern: "*.bam"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
    - peak:
        type: file
        description: Peak/BED file to intersect `bam` against
        pattern: "*.{narrowPeak,broadPeak,bed}"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
output:
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.FRiP.txt":
          type: file
          description: Single-line, 2-column text file with the sample prefix and the FRiP score (reads overlapping `peak` divided by total mapped reads)
          pattern: "*.txt"
  versions_bedtools:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_samtools:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "samtools":
          type: string
          description: The name of the tool
      - "samtools --version 2>&1 | head -1 | sed 's/^samtools //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "samtools":
          type: string
          description: The name of the tool
      - "samtools --version 2>&1 | head -1 | sed 's/^samtools //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
