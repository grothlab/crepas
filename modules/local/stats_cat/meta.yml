# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "stats_cat"
description: Concatenate a set of per-sample transposed stats TSVs (from STATS_TRANSPOSE) into a single summary table, keeping one shared header row and sorting the data rows by ID
keywords:
  - awk
  - samtools
  - stats
  - concatenate
  - qc
tools:
  - gawk:
      description: |
        GNU Awk (gawk) is a text-processing language for extracting and reporting data. Used
        here, together with coreutils (head/tail/sort), to merge many single-row transposed
        stats TSVs into one table: the header is taken from the first file, the remaining data
        rows from all files, and the data rows are sorted by their ID (first) column.
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/gawk.html
      tool_dev_url: http://savannah.gnu.org/projects/gawk/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - t_stats:
        type: file
        description: One or more transposed per-sample stats TSVs (as produced by STATS_TRANSPOSE); all must share the same header row
        pattern: "*.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
output:
  cat:
    - - "*.tsv":
          type: file
          description: Single concatenated summary table (shared header row followed by one ID-sorted data row per input file)
          pattern: "*.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_awk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "awk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_coreutils:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "coreutils":
          type: string
          description: The name of the tool
      - "sort --version 2>&1 | head -1 | sed 's/^sort (GNU coreutils) //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "awk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "coreutils":
          type: string
          description: The name of the tool
      - "sort --version 2>&1 | head -1 | sed 's/^sort (GNU coreutils) //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
