# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bed_to_tagalign"
description: Convert a BED file (single- or paired-end) into ENCODE-style TAGALIGN format
keywords:
  - bed
  - tagalign
  - awk
  - encode
tools:
  - gawk:
      description: |
        GNU Awk (gawk) is a text-processing language for extracting and reporting data. Used
        here to reformat each BED record into one (single-end) or two (paired-end, one per mate)
        6-column TAGALIGN records with a placeholder name ("N") and score (1000), following the
        ENCODE ChIP-seq pipeline convention.
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/gawk.html
      tool_dev_url: http://savannah.gnu.org/projects/gawk/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bed:
        type: file
        description: |
          BED file to convert. For single-end data, a standard BED record. For paired-end data,
          a BEDPE-like record with mate 1 in columns 1-3 and mate 2 in columns 4-6, and read
          names in columns 9-10.
        pattern: "*.bed"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
output:
  tagalign:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.tagAlign":
          type: file
          description: TAGALIGN-format file, one line per single-end read or per mate of a paired-end read
          pattern: "*.tagAlign"
          ontologies: []
  versions_awk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "awk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "awk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
