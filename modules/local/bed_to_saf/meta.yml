# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bed_to_saf"
description: Convert a BED file of genomic intervals into the SAF annotation format that featureCounts reads
keywords:
  - bed
  - saf
  - annotation
  - featurecounts
tools:
  - gawk:
      description: |
        GNU Awk (gawk) is a text-processing language for extracting and reporting data. Used here
        to rewrite BED intervals as SAF records, which means shifting the start coordinate because
        BED is 0-based half-open while SAF is 1-based inclusive, and taking the feature id and
        strand from the BED name and strand columns when they are present.
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/gawk.html
      tool_dev_url: http://savannah.gnu.org/projects/gawk/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing annotation information
          e.g. [ id:'genes' ]
    - bed:
        type: file
        description: |
          Genomic intervals in BED format. Column 4 becomes the feature id, falling back to
          `chr_start_end` when absent, and column 6 becomes the strand, falling back to `.`.
          Track, browser and comment lines are skipped.
        pattern: "*.bed"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
output:
  saf:
    - - meta:
          type: map
          description: |
            Groovy Map containing annotation information
            e.g. [ id:'genes' ]
      - "*.saf":
          type: file
          description: |
            The same intervals as SAF: a header line followed by GeneID, Chr, Start, End and
            Strand, with 1-based inclusive coordinates
          pattern: "*.saf"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_gawk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gawk":
          type: string
          description: The name of the tool
      - "awk --version | head -1 | sed 's/GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gawk":
          type: string
          description: The name of the tool
      - "awk --version | head -1 | sed 's/GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
