# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "annotate_boolean_peaks"
description: Combine a boolean consensus-peak presence/absence table with its HOMER peak annotations into a single annotated table
keywords:
  - awk
  - coreutils
  - consensus peaks
  - peak annotation
  - homer
tools:
  - gawk:
      description: |
        GNU Awk (gawk) is a text-processing language for extracting and reporting data. Used
        here, together with `sort`, to re-order the annotation columns from the HOMER
        annotatePeaks table by genomic coordinate before combining them with the boolean table.
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/gawk.html
      tool_dev_url: http://savannah.gnu.org/projects/gawk/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
  - coreutils:
      description: |
        The GNU Core Utilities are the basic file, shell and text manipulation utilities of the
        GNU operating system. Used here for `cut` to select columns, `sort` to order peaks by
        genomic coordinate, and `paste` to join the boolean and annotation tables column-wise.
      homepage: https://www.gnu.org/software/coreutils/
      documentation: https://www.gnu.org/software/coreutils/manual/coreutils.html
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - boolean_txt:
        type: file
        description: |
          Tab-delimited consensus-peak table with per-sample boolean presence/absence flags,
          as produced by `macs3_merged_expand.py` (e.g. `MACS3_CONSENSUS.out.boolean_txt`).
        pattern: "*.boolean.txt"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
    - homer_peaks:
        type: file
        description: Annotated consensus-peak table from HOMER `annotatePeaks.pl`
        pattern: "*.txt"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
output:
  annotate_peaks_txt:
    - - "*.boolean.annotatePeaks.txt":
          type: file
          description: |
            Tab-delimited table combining the boolean consensus-peak presence/absence flags
            with their HOMER peak annotations
          pattern: "*.boolean.annotatePeaks.txt"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_awk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "awk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_coreutils:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "coreutils":
          type: string
          description: The name of the tool
      - "env echo --version | head -1 | sed 's/^echo (GNU coreutils) //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "awk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "coreutils":
          type: string
          description: The name of the tool
      - "env echo --version | head -1 | sed 's/^echo (GNU coreutils) //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
