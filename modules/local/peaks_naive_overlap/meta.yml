# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "peaks_naive_overlap"
description: Retain peaks from a master peak list that reciprocally overlap both replicate peak sets above a fractional-overlap threshold (ENCODE naive-overlap)
keywords:
  - bedtools
  - peaks
  - overlap
  - encode
tools:
  - bedtools:
      description: |
        A set of tools for genomic analysis tasks, specifically enabling genome arithmetic
        (merge, count, complement, intersect) on various file types. Used here (`intersectBed`)
        to intersect a master peak list against two replicate peak sets in turn, following the
        ENCODE ChIP-seq pipeline naive-overlap convention.
      homepage: https://bedtools.readthedocs.io/
      documentation: https://bedtools.readthedocs.io/en/latest/content/tools/intersect.html
      tool_dev_url: https://github.com/arq5x/bedtools2
      doi: "10.1093/bioinformatics/btq033"
      licence: ["MIT"]
      identifier: "biotools:bedtools"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - sample_peaks:
        type: file
        description: Exactly two replicate peak files to reciprocally intersect against `peak_list`
        pattern: "*.{narrowPeak,broadPeak,bed}"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
    - peak_list:
        type: file
        description: Master/pooled peak list to filter down to naive-overlap peaks
        pattern: "*.{narrowPeak,broadPeak,bed}"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
    - threshold:
        type: float
        description: Minimum fractional overlap (of either peak's length) required to keep an intersection; defaults to 0.05 if not provided
  - - peak_type:
        type: string
        description: File extension/type of `peak_list` and of the filtered output; one of `narrowPeak`, `broadPeak` or `bed`
        pattern: "narrowPeak|broadPeak|bed"
output:
  peak_overlap:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.${peak_type}":
          type: file
          description: Master-list peaks that reciprocally overlap both `sample_peaks` replicates above `threshold`
          pattern: "*.{narrowPeak,broadPeak,bed}"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  versions_bedtools:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_gawk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gawk":
          type: string
          description: The name of the tool
      - "awk -Wversion | sed '1!d; s/.*Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gawk":
          type: string
          description: The name of the tool
      - "awk -Wversion | sed '1!d; s/.*Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
