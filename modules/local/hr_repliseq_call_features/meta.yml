# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "hr_repliseq_call_features"
description: Call initiation zones, timing transition regions, breakages, termination sites and late constant-timing regions from a high-resolution Repli-seq array
keywords:
  - repli-seq
  - replication timing
  - initiation zone
  - timing transition region
  - bed
tools:
  - "HighResRepliSeq":
      description: |
        Implementation accompanying the high-resolution Repli-seq method. Bins of the
        Repli-seq array are clustered with BIRCH on the S phase fraction in which they replicate,
        and the resulting profile is read for the shapes that correspond to replication features:
        peaks are initiation zones, monotone slopes are timing transition regions, direction
        changes within a slope are breakages, and valleys are termination sites when small or
        late constant-timing regions when large. The feature-finding functions are vendored into
        this pipeline's `bin/` directory, since the package is not distributed through conda or
        PyPI.
      homepage: https://github.com/oliviacamel/High-Resolution-RepliSeq
      documentation: https://github.com/oliviacamel/High-Resolution-RepliSeq
      doi: "10.1186/s13059-020-01983-8"
      licence: ["Apache-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample (condition) information
          e.g. [ id:'test' ]
    - array:
        type: file
        description: |
          Repli-seq array from `hr_repliseq_make_array`: one row per genomic bin, indexed by
          chrom/start/end, one column per S phase fraction.
        pattern: "*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
output:
  iz:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_IZ.bed":
          type: file
          description: |
            Initiation zones, as chrom/start/end plus the S phase fraction they initiate in.
          pattern: "*.hr_IZ.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  ttr:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_TTR.bed":
          type: file
          description: |
            Timing transition regions, as chrom/start/end plus the S phase fraction they span
            and the direction of the transition (rightward or leftward).
          pattern: "*.hr_TTR.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  breakage:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_breakage.overlap.bed":
          type: file
          description: |
            Points at which a timing transition reverses direction.
          pattern: "*.hr_breakage.overlap.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  termination:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_termination.bed":
          type: file
          description: |
            Termination sites: valleys in the replication-timing profile up to
            `--termination_max_size` wide.
          pattern: "*.hr_termination.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  ctr:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_CTR.bed":
          type: file
          description: |
            Late constant-timing regions: valleys wider than `--termination_max_size`.
          pattern: "*.hr_CTR.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  partition:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_partition.overlap.bed":
          type: file
          description: |
            The features resolved into a partition, in which every analysed bin belongs to
            exactly one feature. Unlike the per-feature BEDs above, which are the raw calls
            and overlap, this is what genome-fraction percentages should be read from.
          pattern: "*.hr_partition.overlap.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  breakage_disjoint:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_breakage.disjoint.bed":
          type: file
          description: |
            Breakages under the reading that keeps them out of bins a timing transition region
            already claims. Usually empty, since the slope finder runs through the plateaus a
            breakage is made of.
          pattern: "*.hr_breakage.disjoint.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  breakage_flanked:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_breakage.flanked.bed":
          type: file
          description: |
            Breakages under the paper's own wording: a plateau that is the seam between two
            different timing transition regions rather than a step inside one.
          pattern: "*.hr_breakage.flanked.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  partition_disjoint:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_partition.disjoint.bed":
          type: file
          description: |
            The partition built from the disjoint breakage set.
          pattern: "*.hr_partition.disjoint.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  partition_flanked:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_partition.flanked.bed":
          type: file
          description: |
            The partition built from the flanked breakage set. Of the three, this is the one
            whose transition-plus-termination fraction matches the paper's reported range.
          pattern: "*.hr_partition.flanked.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  ttr_speed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_TTR.speed.tsv":
          type: file
          description: |
            Fork speed within each timing transition region, in kb/min, from its length and the
            stretch of S phase it spans. Regions are first stitched back together across the
            breakages interrupting them, as the paper does before estimating speed;
            `breakages_spanned` records how many.
          pattern: "*.hr_TTR.speed.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  cluster_rank:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_cluster_rank.tsv":
          type: file
          description: |
            The S phase fraction of the cluster centroid each bin was assigned to, one row per
            analysed bin. This is the profile every feature is read off, and plotting it is what
            makes a feature's shape visible.
          pattern: "*.hr_cluster_rank.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  qc:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "*.hr_features.qc.txt":
          type: file
          description: |
            Counts, total bp and genome fraction of every feature, both as raw calls and as the
            partition, along with the parameters they were called with.
          pattern: "*.hr_features.qc.txt"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Textual format
  summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample (condition) information
            e.g. [ id:'test' ]
      - "hr_repliseq_features_table.tsv":
          type: file
          description: |
            One row per sample holding the number of features of each kind, for the MultiQC report.
          pattern: "hr_repliseq_features_table.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - "python3 --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "numpy":
          type: string
          description: The name of the tool
      - "python3 -c 'import numpy; print(numpy.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "pandas":
          type: string
          description: The name of the tool
      - "python3 -c 'import pandas; print(pandas.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_sklearn:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "scikit-learn":
          type: string
          description: The name of the tool
      - "python3 -c 'import sklearn; print(sklearn.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - "python3 --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
