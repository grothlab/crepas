# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bed_filter_blacklist"
description: Remove peaks that overlap a blacklist of regions, clamp negative/out-of-range coordinates and cap the score column
keywords:
  - bed
  - narrowpeak
  - broadpeak
  - blacklist
  - bedtools
  - awk
tools:
  - bedtools:
      description: |
        A set of tools for genomic analysis tasks, specifically enabling genome arithmetic
        (merge, count, complement, intersect) on various file types. Used here (`bedtools
        intersect -v`) to remove peaks overlapping a blacklist of regions.
      homepage: https://bedtools.readthedocs.io/
      documentation: https://bedtools.readthedocs.io/en/latest/content/tools/intersect.html
      tool_dev_url: https://github.com/arq5x/bedtools2
      doi: "10.1093/bioinformatics/btq033"
      licence: ["MIT"]
      identifier: "biotools:bedtools"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - peaks:
        type: file
        description: Peak/BED file to filter, optionally gzip-compressed
        pattern: "*.{narrowPeak,broadPeak,bed,narrowPeak.gz,broadPeak.gz,bed.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
  - - meta2:
        type: map
        description: |
          Groovy Map containing blacklist sample information
          e.g. [ id:'blacklist' ]
    - blacklist:
        type: file
        description: BED file of blacklisted regions to remove from `peaks`
        pattern: "*.bed"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
  - filter_chr:
      type: boolean
      description: If `true`, additionally keep only peaks on chromosomes matching `chr[0-9XY]+`
      pattern: "true or false"
  - peak_type:
      type: string
      description: File extension/type of `peaks` and of the filtered output; one of `narrowPeak`, `broadPeak` or `bed`
      pattern: "narrowPeak|broadPeak|bed"
  - max_score:
      type: integer
      description: Score-column values above this are clamped to this value (defaults to 1000 if not set)
output:
  peaks:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.${peak_type}":
          type: file
          description: Filtered peak/BED file with blacklisted regions removed and the score column capped at `max_score`
          pattern: "*.{narrowPeak,broadPeak,bed}"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  versions_bedtools:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_gawk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gawk":
          type: string
          description: The name of the tool
      - "awk -Wversion | sed '1!d; s/.*Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gawk":
          type: string
          description: The name of the tool
      - "awk -Wversion | sed '1!d; s/.*Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
