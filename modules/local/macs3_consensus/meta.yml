# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "macs3_consensus"
description: Build a consensus peak set across samples/replicates, with a boolean overlap-filtering table, a SAF file for featureCounts, and an UpSet-style intersection plot
keywords:
  - macs3
  - consensus
  - peaks
  - bedtools
  - upset
tools:
  - bedtools:
      description: |
        A set of tools for genomic analysis tasks, specifically enabling genome arithmetic
        (merge, count, complement, intersect) on various file types. Used here (`mergeBed`) to
        merge all input peak files into a single consensus interval set.
      homepage: https://bedtools.readthedocs.io/
      documentation: https://bedtools.readthedocs.io/en/latest/content/tools/merge.html
      tool_dev_url: https://github.com/arq5x/bedtools2
      doi: "10.1093/bioinformatics/btq033"
      licence: ["MIT"]
      identifier: "biotools:bedtools"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - peaks:
        type: file
        description: Two or more MACS3 peak files (narrowPeak or broadPeak) to build a consensus set from
        pattern: "*.{narrowPeak,broadPeak}"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
  - is_narrow_peak:
      type: boolean
      description: If `true`, treat `peaks` as narrowPeak (10 merge columns); if `false`, treat as broadPeak (9 merge columns)
      pattern: "true or false"
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bed":
          type: file
          description: Consensus peak set in BED6 format
          pattern: "*.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  saf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.saf":
          type: file
          description: Consensus peak set in Simplified Annotation Format (SAF), for use with featureCounts
          pattern: "*.saf"
  pdf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pdf":
          type: file
          description: UpSet-style plot of peak intersections across samples
          pattern: "*.pdf"
          ontologies:
            - edam: "http://edamontology.org/format_3508" # PDF
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.antibody.txt":
          type: file
          description: Single-line file mapping the consensus BED filename to its antibody/sample-group directory path
          pattern: "*.antibody.txt"
  boolean_txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.boolean.txt":
          type: file
          description: Consensus intervals with a boolean column per input sample marking peak presence/absence
          pattern: "*.boolean.txt"
  intersect_txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.intersect.txt":
          type: file
          description: Peak intersection counts across samples, as used to generate the UpSet plot
          pattern: "*.intersect.txt"
  versions_bedtools:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - "python --version 2>&1 | sed 's/^Python //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_rbase:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "r-base":
          type: string
          description: The name of the tool
      - "R --version 2>&1 | head -1 | sed 's/^.*R version //; s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - "python --version 2>&1 | sed 's/^Python //'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "r-base":
          type: string
          description: The name of the tool
      - "R --version 2>&1 | head -1 | sed 's/^.*R version //; s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@JoseEspinosa"
  - "@drpatelh"
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
