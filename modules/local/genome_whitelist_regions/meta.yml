# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "genome_whitelist_regions"
description: Build a genome-wide whitelist of intervals to keep, by complementing a blacklist against the chromosome sizes, or by using the whole genome when no blacklist is given
keywords:
  - bedtools
  - awk
  - blacklist
  - whitelist
  - genome
tools:
  - bedtools:
      description: |
        A set of tools for genomic analysis tasks, specifically enabling genome arithmetic
        (merge, count, complement, intersect) on various file types. Used here (`sortBed`,
        `complementBed`) to complement a blacklist of regions against the whole genome,
        producing the whitelist of regions to keep.
      homepage: https://bedtools.readthedocs.io/
      documentation: https://bedtools.readthedocs.io/en/latest/content/tools/complement.html
      tool_dev_url: https://github.com/arq5x/bedtools2
      doi: "10.1093/bioinformatics/btq033"
      licence: ["MIT"]
      identifier: "biotools:bedtools"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - sizes:
        type: file
        description: "Chromosome sizes file (2-column TSV: name, length)"
        pattern: "*.sizes"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
  - - meta2:
        type: map
        description: |
          Groovy Map containing blacklist sample information
          e.g. [ id:'blacklist' ]
    - blacklist:
        type: file
        description: Optional BED file of blacklisted regions to exclude from the whitelist. When empty (`[]`), the whitelist is the whole genome from `sizes`
        pattern: "*.bed"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bed":
          type: file
          description: Whitelist of genomic intervals to keep -- the complement of `blacklist` against `sizes`, or the whole genome when `blacklist` is empty
          pattern: "*.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  versions_bedtools:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_gawk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gawk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bedtools":
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gawk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
