# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bam_split_by_chromosome"
description: Extract alignments for a given list of chromosomes/contigs from a BAM file, optionally converting format and writing an index
keywords:
  - bam
  - cram
  - sam
  - samtools
  - subset
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM file to extract chromosomes/contigs from
        pattern: "*.bam"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
    - bai:
        type: file
        description: BAM index file
        pattern: "*.bai"
        ontologies:
          - edam: "http://edamontology.org/format_3327" # BAI
    - chrom_list:
        type: list
        description: List of chromosome/contig names to extract; passed as region arguments to `samtools view`
  - index_format:
      type: string
      description: Optional index format to write alongside the output (`bai`, `csi` or `crai`); leave unset for no index
      pattern: "bai|csi|crai"
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "${prefix}.bam":
          type: file
          description: BAM file containing only the requested chromosomes/contigs
          pattern: "*.bam"
          ontologies:
            - edam: "http://edamontology.org/format_2572" # BAM
  cram:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "${prefix}.cram":
          type: file
          description: CRAM file containing only the requested chromosomes/contigs; produced when `task.ext.args` sets `--output-fmt cram`
          pattern: "*.cram"
          ontologies:
            - edam: "http://edamontology.org/format_3462" # CRAM
  sam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "${prefix}.sam":
          type: file
          description: SAM file containing only the requested chromosomes/contigs; produced when `task.ext.args` sets `--output-fmt sam`
          pattern: "*.sam"
          ontologies:
            - edam: "http://edamontology.org/format_2573" # SAM
  crai:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "${prefix}.cram.crai":
          type: file
          description: CRAM index file; produced when `index_format` is `crai`
          pattern: "*.crai"
          ontologies: []
  csi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "${prefix}.bam.csi":
          type: file
          description: CSI index file; produced when `index_format` is `csi`
          pattern: "*.csi"
          ontologies: []
  bai:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "${prefix}.bam.bai":
          type: file
          description: BAI index file; produced when `index_format` is `bai`
          pattern: "*.bai"
          ontologies:
            - edam: "http://edamontology.org/format_3327" # BAI
  versions_samtools:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "samtools":
          type: string
          description: The name of the tool
      - "samtools version | sed '1!d;s/.* //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "samtools":
          type: string
          description: The name of the tool
      - "samtools version | sed '1!d;s/.* //'":
          type: eval
          description: The expression to obtain the version of the tool
tools:
  - samtools:
      description: |
        SAMtools is a suite of programs for interacting with high-throughput sequencing data in
        SAM/BAM/CRAM format. Used here (via `samtools view` with region arguments) to extract
        alignments for a specific set of chromosomes/contigs.
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      tool_dev_url: https://github.com/samtools/samtools
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]
      identifier: "biotools:samtools"
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
