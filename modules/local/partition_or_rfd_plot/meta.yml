# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "partition_or_rfd_plot"
description: |
  Plot averaged SCAR-seq/eSPAN partition or OK-seq RFD profiles around replication initiation zones
  using an R/Bioconductor script.
keywords:
  - scar-seq
  - ok-seq
  - rfd
  - partition
  - initiation-zones
  - plot
tools:
  - r-base:
      description: |
        R is a free software environment for statistical computing and graphics. Runs the bundled
        `partition_or_rfd_plot.R` script (tidyverse + ggplot2 + GenomicAlignments/GenomicFeatures)
        to plot raw and smoothed partition/RFD profiles centred on initiation zones and to write
        per-sample mean value tables.
      homepage: https://www.r-project.org/
      documentation: https://www.r-project.org/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - partition:
        type: file
        description: Optional SCAR-seq or eSPAN partition table(s) (12-column) to plot
        pattern: "*.{tsv,bed}"
    - strandedinput:
        type: file
        description: Optional stranded-input partition table(s) (12-column)
        pattern: "*.{tsv,bed}"
    - minusinput:
        type: file
        description: Optional input-corrected partition table(s) (12-column)
        pattern: "*.{tsv,bed}"
    - rfd_files:
        type: file
        description: "Optional OK-seq RFD table(s) (12-column). With several, the scatter plots are named `<prefix>.<sample>.scatter_plot.*`"
        pattern: "*.{tsv,bed}"
    - initiation_zones:
        type: file
        description: BED file of initiation zones to centre the profiles on (required)
        pattern: "*.bed"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
  - - meta2:
        type: map
        description: |
          Groovy Map containing blacklist information
          e.g. [ id:'blacklist' ]
    - blacklist:
        type: file
        description: Optional BED file of regions to exclude
        pattern: "*.bed"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
  - - meta3:
        type: map
        description: |
          Groovy Map containing genome information
          e.g. [ id:'genome' ]
    - chrom_sizes:
        type: file
        description: "Chromosome sizes file (2-column TSV: name, length)"
        pattern: "*.sizes"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
output:
  plot_smoothed_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_smoothed.pdf":
          type: file
          description: Raw partition/RFD profile plot, without the standard deviation ribbon (PDF)
          pattern: "*_plot_smoothed.pdf"
  plot_smoothed_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_smoothed.png":
          type: file
          description: Raw partition/RFD profile plot, without the standard deviation ribbon (PNG)
          pattern: "*_plot_smoothed.png"
  plot_smoothed_sd_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_smoothed.sd.pdf":
          type: file
          description: Raw partition/RFD profile plot, with the standard deviation ribbon (PDF)
          pattern: "*_plot_smoothed.sd.pdf"
  plot_smoothed_sd_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_smoothed.sd.png":
          type: file
          description: Raw partition/RFD profile plot, with the standard deviation ribbon (PNG)
          pattern: "*_plot_smoothed.sd.png"
  plot_smoothed_gam_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_smoothed.gam.pdf":
          type: file
          description: Smoothed partition/RFD profile plot (PDF)
          pattern: "*_plot_smoothed.gam.pdf"
  plot_smoothed_gam_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_smoothed.gam.png":
          type: file
          description: Smoothed partition/RFD profile plot (PNG)
          pattern: "*_plot_smoothed.gam.png"
  plot_raw_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_raw.pdf":
          type: file
          description: Unsmoothed partition/RFD profile plot, without the standard deviation ribbon (PDF)
          pattern: "*_plot_raw.pdf"
  plot_raw_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_raw.png":
          type: file
          description: Unsmoothed partition/RFD profile plot, without the standard deviation ribbon (PNG)
          pattern: "*_plot_raw.png"
  plot_raw_sd_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_raw.sd.pdf":
          type: file
          description: Unsmoothed partition/RFD profile plot, with the standard deviation ribbon (PDF)
          pattern: "*_plot_raw.sd.pdf"
  plot_raw_sd_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_raw.sd.png":
          type: file
          description: Unsmoothed partition/RFD profile plot, with the standard deviation ribbon (PNG)
          pattern: "*_plot_raw.sd.png"
  plot_smoothed_iqr_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_smoothed.iqr.pdf":
          type: file
          description: Smoothed partition/RFD profile plot, median line with the interquartile range across initiation zones (PDF)
          pattern: "*_plot_smoothed.iqr.pdf"
  plot_smoothed_iqr_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_smoothed.iqr.png":
          type: file
          description: Smoothed partition/RFD profile plot, median line with the interquartile range across initiation zones (PNG)
          pattern: "*_plot_smoothed.iqr.png"
  plot_raw_iqr_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_raw.iqr.pdf":
          type: file
          description: Unsmoothed partition/RFD profile plot, median line with the interquartile range across initiation zones (PDF)
          pattern: "*_plot_raw.iqr.pdf"
  plot_raw_iqr_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_plot_raw.iqr.png":
          type: file
          description: Unsmoothed partition/RFD profile plot, median line with the interquartile range across initiation zones (PNG)
          pattern: "*_plot_raw.iqr.png"
  quantile_values:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_quantile_values.tsv":
          type: file
          description: Per-sample median and quartiles of the partition/RFD values across initiation zones at each distance, as plotted in the interquartile range plots
          pattern: "*_quantile_values.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  mean_values:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_mean_values.tsv":
          type: file
          description: Per-sample mean partition/RFD value table
          pattern: "*_mean_values.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  violin_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_violin_plot_raw.pdf":
          type: file
          description: Violin plot of one partition/RFD value per initiation zone and sample, with paired tests between samples (PDF). Not written if no initiation zone has bins on both sides.
          pattern: "*_violin_plot_raw.pdf"
  violin_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_violin_plot_raw.png":
          type: file
          description: Violin plot of one partition/RFD value per initiation zone and sample, with paired tests between samples (PNG). Not written if no initiation zone has bins on both sides.
          pattern: "*_violin_plot_raw.png"
  violin_values:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_violin_values.tsv":
          type: file
          description: Values in the violin plots, one per initiation zone and sample ((downstream - upstream mean of the raw values) / 2), with the number of bins on each side
          pattern: "*_violin_values.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  violin_stats:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_violin_stats.tsv":
          type: file
          description: Paired tests between the samples in the violin plots (Wilcoxon signed-rank or Newey-West, set with --violin_test in ext.args), with the number of initiation zones, medians, median and mean paired differences, and Holm-adjusted p-values
          pattern: "*_violin_stats.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  profile_difference_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_profile_difference_plot_raw.*.pdf":
          type: file
          description: Mean paired difference of the partition/RFD profiles of each pair of samples around the initiation zones, with its 95% confidence interval and the significant clusters of the permutation test shaded (PDF), one file per set of compared samples (`*.<partition type>.pdf`, `*.RFD.pdf`), split into numbered parts (`*.<set>.part<N>.pdf`) of at most 60 pairs when a set has more. Not written for sets with fewer than two samples.
          pattern: "*_profile_difference_plot_raw.*.pdf"
  profile_difference_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_profile_difference_plot_raw.*.png":
          type: file
          description: Mean paired difference of the partition/RFD profiles of each pair of samples around the initiation zones, with its 95% confidence interval and the significant clusters of the permutation test shaded (PNG), one file per set of compared samples (`*.<partition type>.png`, `*.RFD.png`), split into numbered parts (`*.<set>.part<N>.png`) of at most 60 pairs when a set has more. Not written for sets with fewer than two samples.
          pattern: "*_profile_difference_plot_raw.*.png"
  profile_differences:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_profile_differences.tsv":
          type: file
          description: Mean paired difference, 95% confidence interval, number of initiation zones and paired t statistic of each pair of samples in each distance bin
          pattern: "*_profile_differences.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  profile_tests:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_profile_tests.tsv":
          type: file
          description: Clusters of the sign-flip cluster-based permutation test of the profile differences of each pair of samples (distance range, direction, mass, p-value, and p-value Bonferroni-adjusted over the pairs of the set), or one row per pair without clusters
          pattern: "*_profile_tests.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  window_qc_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_window_qc_plot.*.pdf":
          type: file
          description: Window QC plots (PDF). `*.fates.pdf`, the fate of the windows within the plotted range of the initiation zones per sample (used, below the RPM cutoff, blacklisted, no reads); `*.coverage.pdf`, the percentage of initiation zones with a used window at each distance. Not written if no window lies within the plotted range.
          pattern: "*_window_qc_plot.*.pdf"
  window_qc_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_window_qc_plot.*.png":
          type: file
          description: Window QC plots (PNG), as the PDFs (`*.fates.png`, `*.coverage.png`)
          pattern: "*_window_qc_plot.*.png"
  window_qc:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_window_qc.tsv":
          type: file
          description: Number and percentage of the windows within the plotted range of the initiation zones of each sample by fate (used, below RPM cutoff, blacklisted, no reads)
          pattern: "*_window_qc.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  scatter_pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.scatter_plot.pdf":
          type: file
          description: Optional partition-vs-RFD scatter plot(s), one per RFD table (PDF)
          pattern: "*.scatter_plot.pdf"
  scatter_png:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.scatter_plot.png":
          type: file
          description: Optional partition-vs-RFD scatter plot(s), one per RFD table (PNG)
          pattern: "*.scatter_plot.png"
  versions_rbase:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "r-base":
          type: string
          description: The name of the tool
      - "R --version 2>&1 | head -1 | sed 's/^R version //; s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "r-base":
          type: string
          description: The name of the tool
      - "R --version 2>&1 | head -1 | sed 's/^R version //; s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
