# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "plot_peak_qc"
description: Generate summary plots (peak count, length and chosen score columns) and a summary table from the peak files of any peak caller
keywords:
  - peaks
  - qc
  - plots
tools:
  - r-base:
      description: |
        The R programming language, used here (via the bundled `bin/plot_peak_qc.r` script)
        to summarise and plot peak calls across samples: peak count, peak length, and the
        distributions of the score columns given with `--columns` in `ext.args` (e.g.
        `7:fold:log2,9:-log10(qvalue),8:-log10(pvalue)` for MACS3), plus a per-sample
        summary statistics table.
      homepage: https://www.r-project.org/
      documentation: https://www.r-project.org/other-docs.html
      licence: ["GPL-2.0-or-later"]
      identifier: "biotools:r-base"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - peaks:
        type: file
        description: One or more tab-separated peak files (BED-like, no header) to summarise together
        pattern: "*.{narrowPeak,broadPeak,bed,peak}"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
output:
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.txt":
          type: file
          description: Per-sample peak summary statistics table (score columns and length)
          pattern: "*.summary.txt"
  pdf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pdf":
          type: file
          description: PDF report with peak count, length and score column distribution plots
          pattern: "*.plots.pdf"
          ontologies:
            - edam: "http://edamontology.org/format_3508" # PDF
  versions_rbase:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "r-base":
          type: string
          description: The name of the tool
      - "R --version 2>&1 | head -1 | sed 's/^.*R version //; s/ .*$//'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "r-base":
          type: string
          description: The name of the tool
      - "R --version 2>&1 | head -1 | sed 's/^.*R version //; s/ .*$//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@JoseEspinosa"
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
